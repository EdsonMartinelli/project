services:
  db:
    image: postgres
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_USER: user
      POSTGRES_DB: db
    ports:
      - 5432:5432

  adminer:
    image: adminer
    ports:
      - 8080:8080

  app:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - .:/app # Bind Mount
      - /app/node_modules # Anonymous Volumes
    command: pnpm dev
    depends_on:
      - db
      - adminer
