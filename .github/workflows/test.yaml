name: Unit and Integration Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node and PNPM
        uses: pnpm/action-setup@v6
        with:
          version: 12.11.2
          runtime: node@22
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile pnpm install --frozen-lockfile --allow-build=@parcel/watcher --allow-build=esbuild --allow-build=unrs-resolver

      - name: Run tests
        run: pnpm test
